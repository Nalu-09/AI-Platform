<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nalu-09 ｜ AI企業プラットフォーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--void:#16130E;--panel:#211C15;--panel2:#2A241B;--line:#3A3226;--brass:#C6A15B;--brass-dim:#8C7440;--sage:#8A9A78;--cream:#EDE6D6;--muted:#9A917E;--idle:#6B6350;--mono:"Space Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--void);color:var(--cream);font-family:"Noto Sans JP",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;background-image:radial-gradient(900px 500px at 50% -10%,rgba(198,161,91,.07),transparent 70%);padding:0 16px calc(48px + env(safe-area-inset-bottom))}
  .wrap{max-width:720px;margin:0 auto}
  header{padding:22px 2px 8px;display:flex;align-items:baseline;gap:9px}
  header .star{color:var(--brass)} header .name{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.4rem;letter-spacing:.06em}
  header .sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
  .ns{margin:12px 0 18px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:linear-gradient(180deg,rgba(198,161,91,.06),transparent)}
  .ns .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.22em;color:var(--brass);text-transform:uppercase}
  .ns h1{font-family:"Shippori Mincho",serif;font-weight:700;font-size:1.05rem;margin-top:3px}
  .box{background:var(--panel2);border:1px solid var(--brass-dim);border-radius:14px;padding:16px;margin-bottom:18px}
  .box .lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;margin-bottom:9px}
  textarea{width:100%;background:var(--void);border:1px solid var(--line);color:var(--cream);border-radius:9px;padding:11px 12px;font-family:inherit;font-size:.9rem;margin-bottom:9px;min-height:80px;resize:vertical;line-height:1.6}
  .go{width:100%;background:var(--brass);color:#1c1810;border:none;border-radius:10px;padding:14px;font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
  .go:disabled{opacity:.5;cursor:default}
  .hint{font-size:.72rem;color:var(--muted);margin-top:2px}
  .sl{font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:0 2px 11px;display:flex;align-items:center;gap:10px}
  .sl::after{content:"";flex:1;height:1px;background:var(--line)}
  .depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
  .dept{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass-dim);border-radius:11px;padding:12px 13px;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .3s}
  .dept:hover{border-color:var(--brass-dim);background:var(--panel2)}
  .dept.active{border-color:var(--brass);border-left-color:var(--brass);background:var(--panel2)}
  .dept.flash{box-shadow:0 0 0 2px var(--brass),0 0 18px rgba(198,161,91,.5);border-color:var(--brass)}
  .dept .ix{font-family:var(--mono);font-size:.58rem;color:var(--brass-dim)}
  .dept .nm{font-family:"Shippori Mincho",serif;font-weight:600;font-size:.92rem;margin:2px 0 3px}
  .dept .ds{font-size:.68rem;color:var(--muted);line-height:1.4}
  .dept .badge{position:absolute;top:9px;right:9px;min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:var(--brass);color:#1c1810;font-family:var(--mono);font-size:.62rem;font-weight:700;display:none;align-items:center;justify-content:center;line-height:20px;text-align:center}
  .dept .badge.show{display:inline-flex}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
  .bar .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bar button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.74rem;cursor:pointer}
  .bar button.danger{border-color:#7a4a3a;color:#E58B6E}
  .bar button:disabled{opacity:.4;cursor:default}
  .out{margin-top:12px}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}
  .job.hide{display:none}
  .job .route{padding:11px 15px;font-size:.82rem;color:var(--brass);border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(198,161,91,.05),transparent);display:flex;align-items:center;gap:8px}
  .job .route .spin{width:11px;height:11px;border:2px solid var(--brass-dim);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .job .jh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .job .chk{width:17px;height:17px;flex:none;accent-color:var(--brass);cursor:pointer}
  .job .who{font-family:"Shippori Mincho",serif;font-weight:600;font-size:.92rem;flex:1}
  .job .stt{font-family:var(--mono);font-size:.6rem;padding:3px 9px;border-radius:100px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .job .stt.run{color:var(--brass);border-color:var(--brass-dim)}
  .job .stt.done{color:var(--void);background:var(--sage);border-color:var(--sage)}
  .job .stt.err{color:#E58B6E;border-color:#7a4a3a}
  .job .req{padding:10px 15px;font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--line);background:var(--void)}
  .job .res{padding:14px 15px;font-size:.9rem;line-height:1.85;white-space:pre-wrap}
  .job .copy{margin:0 15px 14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;font-family:inherit;font-size:.78rem;cursor:pointer}
  footer{text-align:center;margin-top:26px;color:var(--idle);font-size:.72rem;line-height:1.7}
  footer .fmk{font-family:"Cormorant Garamond",serif;letter-spacing:.14em;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="star">✦</span><span class="name">Nalu-09</span><span class="sub">AI企業</span></header>
  <div class="ns"><span class="tag">★ 北極星</span><h1>飲食にとどまらない、会員制事業の確立 ── 1日のすべてを、Nalu-09で</h1></div>

  <div class="box">
    <div class="lbl">秘書・指揮官｜やりたいことを話す</div>
    <textarea id="order" placeholder="例：飲食店オーナーに刺さるThreads投稿を1本作って／競合を調べて／LINEの配信文を書いて"></textarea>
    <button class="go" id="goBtn" onclick="RUN()">秘書に依頼する</button>
    <div class="hint">部門は選ばなくてOK<br>秘書がどの部門の案件か判断して振り分けます。<br>下の部門カードを押すと、その部門の成果物だけ見返せます。</div>
  </div>

  <div class="sl">部門（クリックで絞り込み） / DEPARTMENTS</div>
  <div class="depts" id="depts"></div>

  <div class="bar">
    <div class="left"><span id="filterlabel">すべての成果物</span><button id="showAllBtn" onclick="showAll()" style="display:none">すべて表示</button></div>
    <div class="left"><button onclick="selectAllVisible()">表示中を全選択</button><button class="danger" id="delBtn" onclick="deleteSelected()" disabled>選択したものを削除</button></div>
  </div>
  <div class="out" id="out"></div>
  <footer><div class="fmk">Nalu-09</div>社長は秘書1人に依頼するだけ<br>AI企業プラットフォーム ver.6</footer>
</div>

<script>
var GAS_URL = "PASTE_YOUR_GAS_URL_HERE";
var STORE_KEY = "nalu09_jobs_v6";
var jobs = [];
var activeFilter = null;

var ORDER = ["research","content","pm","analytics","offer","cs","support","finance","brand","legal","bizdev"];
var NAMES = {research:"リサーチ部",content:"コンテンツ制作部",pm:"制作進行部",analytics:"分析部",offer:"オファー企画部",cs:"CS・配信部",support:"顧客対応部",finance:"経理・数値管理部",brand:"世界観管理部",legal:"法務・コンプラ部",bizdev:"事業開発部"};
var IX = {research:"01",content:"02",pm:"03",analytics:"04",offer:"05",cs:"06",support:"07",finance:"08",brand:"09",legal:"10",bizdev:"11"};
var DS = {research:"競合・トレンド・隙間",content:"投稿・キャプション・プロフィール",pm:"動画・画像の制作図",analytics:"数値→次の方針",offer:"商品・料金・入口",cs:"LINE配信・返信文",support:"DM・問い合わせ返信",finance:"売上・費用の管理",brand:"トーン・世界観の統一",legal:"規約・個人情報",bizdev:"次の事業の種"};

function nameToId(name){ for(var k in NAMES) if(NAMES[k]===name) return k; return null; }
function load(){ try{ jobs=JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){ jobs=[]; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(jobs)); }catch(e){} }
function esc(s){ s=s==null?'':(''+s); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 部門カードを描画
(function buildDepts(){
  var d=document.getElementById('depts');
  for (var i=0;i<ORDER.length;i++){
    var id=ORDER[i], el=document.createElement('div');
    el.className='dept'; el.setAttribute('data-id',id);
    el.innerHTML='<span class="badge" data-badge="'+id+'"></span><div class="ix">'+IX[id]+'</div><div class="nm">'+NAMES[id]+'</div><div class="ds">'+DS[id]+'</div>';
    (function(cid){ el.onclick=function(){ toggleFilter(cid); }; })(id);
    d.appendChild(el);
  }
})();

function counts(){ var c={}; for(var i=0;i<jobs.length;i++){ var id=nameToId(jobs[i].name); if(id) c[id]=(c[id]||0)+1; } return c; }
function updateBadges(){
  var c=counts();
  var b=document.querySelectorAll('.badge');
  for (var i=0;i<b.length;i++){ var id=b[i].getAttribute('data-badge'); if(c[id]){ b[i].textContent=c[id]; b[i].className='badge show'; } else { b[i].textContent=''; b[i].className='badge'; } }
}
function flash(id){ var el=document.querySelector('.dept[data-id="'+id+'"]'); if(!el)return; el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); },1400); }

function render(){
  var out=document.getElementById('out'); out.innerHTML='';
  for (var i=0;i<jobs.length;i++){
    var j=jobs[i]; var jid=nameToId(j.name);
    if (activeFilter && jid!==activeFilter) continue;
    var el=document.createElement('div'); el.className='job'; var html='';
    if (j.phase==='routing') html+='<div class="route"><span class="spin"></span>秘書が担当部門を判断中…</div>';
    else if (j.name) html+='<div class="route">この依頼は〈'+esc(j.name)+'〉の案件です。担当部門に振りました。</div>';
    var sc=j.status==='done'?'stt done':(j.status==='err'?'stt err':'stt run');
    var stx=j.status==='done'?'完了':(j.status==='err'?'エラー':'作業中…');
    var who=j.name?esc(j.name):'秘書';
    html+='<div class="jh"><input type="checkbox" class="chk" data-i="'+i+'" onchange="onCheck()"><span class="who">'+who+'</span><span class="'+sc+'">'+stx+'</span></div>';
    html+='<div class="req">依頼：'+esc(j.order)+'</div>';
    if (j.result) html+='<div class="res">'+esc(j.result)+'</div>';
    if (j.status==='done'&&j.result) html+='<button class="copy" data-i="'+i+'" onclick="copyOne(this)">コピー</button>';
    el.innerHTML=html; out.appendChild(el);
  }
  updateBadges(); updateDelBtn();
}

function RUN(){
  var btn=document.getElementById('goBtn'); if(btn.disabled) return;
  var el=document.getElementById('order'); var order=el.value;
  if(!order){ el.focus(); return; }
  btn.disabled=true; el.value='';
  var job={ order:order, name:'', phase:'routing', status:'run', result:'', t:Date.now() };
  jobs.unshift(job); save(); render();
  var finish=function(){ btn.disabled=false; save(); render(); };

  if (GAS_URL.indexOf('PASTE')>-1){ job.phase='done'; job.name='設定エラー'; job.status='done'; job.result='GASのURLが未設定です。コード上部の GAS_URL に…/exec を貼ってください。'; finish(); return; }

  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'route',order:order})})
  .then(function(r){return r.json();})
  .then(function(d){
    job.name=d.name||'コンテンツ制作部'; job.phase='running'; save(); render();
    var id=nameToId(job.name); if(id) flash(id);
    return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'run',dep:d.dep,order:order})});
  })
  .then(function(r){return r.json();})
  .then(function(d){ job.result=d.text||'(空の応答)'; job.status='done'; var id=nameToId(job.name); if(id) flash(id); finish(); })
  .catch(function(e){ job.status='err'; job.result='実行できません：'+e.message+'\nGASのURLとアクセス「全員」を確認してください。'; finish(); });
}

function toggleFilter(id){
  if (activeFilter===id){ showAll(); return; }
  activeFilter=id;
  var all=document.querySelectorAll('.dept');
  for (var i=0;i<all.length;i++) all[i].classList.toggle('active', all[i].getAttribute('data-id')===id);
  document.getElementById('filterlabel').textContent=IX[id]+' '+NAMES[id]+' の成果物';
  document.getElementById('showAllBtn').style.display='';
  render();
}
function showAll(){
  activeFilter=null;
  var all=document.querySelectorAll('.dept'); for(var i=0;i<all.length;i++) all[i].classList.remove('active');
  document.getElementById('filterlabel').textContent='すべての成果物';
  document.getElementById('showAllBtn').style.display='none';
  render();
}
function copyOne(btn){ var i=+btn.getAttribute('data-i'); if(navigator.clipboard)navigator.clipboard.writeText(jobs[i].result); btn.textContent='コピー済み ✓'; setTimeout(function(){btn.textContent='コピー';},1500); }
function checkedBoxes(){ return document.querySelectorAll('.chk:checked'); }
function onCheck(){ updateDelBtn(); }
function updateDelBtn(){ document.getElementById('delBtn').disabled=checkedBoxes().length===0; }
function selectAllVisible(){ var all=document.querySelectorAll('.chk'),u=false; for(var i=0;i<all.length;i++)if(!all[i].checked){u=true;break;} for(var i=0;i<all.length;i++)all[i].checked=u; updateDelBtn(); }
function deleteSelected(){ var b=checkedBoxes(); if(!b.length)return; if(!confirm('選択した '+b.length+' 件を削除します。よろしいですか？'))return; var idx=[]; for(var i=0;i<b.length;i++)idx.push(+b[i].getAttribute('data-i')); idx.sort(function(a,b){return b-a;}); for(var i=0;i<idx.length;i++)jobs.splice(idx[i],1); save(); render(); }

load(); render();
</script>
</body>
</html>
